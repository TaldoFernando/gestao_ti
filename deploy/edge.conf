# Borda do blue-green (ADR 0008). A cor ativa vem de state/active.conf, escrito pelo deploy.sh:
#   upstream app { server web-blue:80; keepalive 64; }
# Trocar de cor = reescrever esse arquivo e "nginx -s reload": as conexões em andamento terminam na cor antiga.
include /etc/nginx/upstream/active.conf;

server {
  listen 80;
  client_max_body_size 20m;

  location / {
    proxy_pass http://app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
