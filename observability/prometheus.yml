# Coleta das métricas (issue #14). Os serviços expõem /metrics na porta interna 9464, sem passar pelo gateway.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: servicos
    static_configs:
      - targets: [gateway:9464, ticket-service:9464, asset-service:9464, notification-worker:9464]

  # Plugin rabbitmq_prometheus: tamanho de cada fila (notifications, .retry e .dlq).
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs:
      - targets: [rabbitmq:15692]
