# Coleta das métricas (issue #14). Os serviços expõem /metrics na porta interna 9464, sem passar pelo gateway.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: servicos
    # DNS A discovery returns one target per Compose replica, unlike a static target that
    # resolves only one address from a replicated service name.
    dns_sd_configs:
      - names: [gateway, ticket-service, asset-service, notification-worker]
        type: A
        port: 9464
        refresh_interval: 5s

  # Plugin rabbitmq_prometheus: tamanho de cada fila (notifications, .retry e .dlq).
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs:
      - targets: [rabbitmq:15692]
