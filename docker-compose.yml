x-backend: &backend
  env_file: .env
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
    interval: 10s
    retries: 5

x-postgres: &postgres
  image: postgres:16-alpine
  env_file: .env
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
    interval: 5s
    retries: 10

services:
  web:
    build: { context: ./apps/web }
    ports: ["8080:80"]
    depends_on: [gateway]

  gateway:
    <<: *backend
    build: { context: ./apps/backend, args: { APP: gateway } }
    ports: ["3000:3000"]
    environment:
      TICKET_SERVICE_URL: http://ticket-service:3000
      ASSET_SERVICE_URL: http://asset-service:3000
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      RATE_LIMIT_OFF: ${RATE_LIMIT_OFF:-0}
    depends_on: [ticket-service, asset-service]

  ticket-service:
    <<: *backend
    build: { context: ./apps/backend, args: { APP: ticket-service } }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-tickets:5432/db_tickets
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      ASSET_SERVICE_URL: http://asset-service:3000
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on:
      postgres-tickets: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  asset-service:
    <<: *backend
    build: { context: ./apps/backend, args: { APP: asset-service } }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-assets:5432/db_assets
    depends_on:
      postgres-assets: { condition: service_healthy }

  notification-worker:
    build: { context: ./apps/backend, args: { APP: notification-worker } }
    env_file: .env
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    depends_on:
      rabbitmq: { condition: service_healthy }

  postgres-tickets:
    <<: *postgres
    environment: { POSTGRES_DB: db_tickets }
    volumes: [pgdata-tickets:/var/lib/postgresql/data]

  postgres-assets:
    <<: *postgres
    environment: { POSTGRES_DB: db_assets }
    volumes: [pgdata-assets:/var/lib/postgresql/data]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    env_file: .env
    ports: ["15672:15672"]
    # Liga o plugin rabbitmq_prometheus (porta 15692) para o Prometheus ler o tamanho das filas.
    volumes: [./observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025"]

  # Observabilidade (issue #14): o Prometheus lê /metrics de cada serviço (porta interna 9464) e as filas do
  # RabbitMQ; o Grafana já sobe com a fonte de dados e o painel "Gestão de TI — visão geral".
  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes: [./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.3.1
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-troque-esta-senha}
      # Leitura sem login, para abrir o painel direto na apresentação; editar exige o admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gestao-ti.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      retries: 20

volumes:
  pgdata-tickets:
  pgdata-assets:
  uploads:
