# Conexões reaproveitadas com o gateway. Sem isso, cada requisição abria um socket novo e, sob carga
# (~1.300 req/s no k6), as portas efêmeras se esgotavam: 502 "Address not available". Ver docs/testes.md.
upstream gateway {
  server gateway:3000;
  keepalive 64;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 20m;
  absolute_redirect off; # redirects relativos: não perdem a porta publicada (8080)

  location /api/ {
    proxy_pass http://gateway;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Acrescenta o IP de quem conectou. O gateway confia só nos últimos saltos (TRUST_PROXY_HOPS), então um
    # X-Forwarded-For forjado pelo cliente não muda o IP usado no rate limit.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /favicon.ico { return 301 /icon-ti.svg; }
  location / { try_files $uri /index.html; }
}
